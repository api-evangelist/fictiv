aid: fictiv
name: Fictiv
description: 'Fictiv is a digital manufacturing and supply chain platform that connects
  engineering and hardware teams with a vetted global network of manufacturers to
  source custom mechanical parts. It provides instant online quoting, automated design-for-manufacturability
  (DFM) analysis, and end-to-end order visibility across CNC machining, injection
  molding, 3D printing, sheet metal, urethane casting, and compression molding —
  from rapid prototyping through full-scale production. Now part of MISUMI, Fictiv
  operates a quote-to-order web platform at app.fictiv.com; it does not currently
  publish a public developer API.'
